<head>

<body>
<div id="layers-root"></div>
<script type="module">
import { mount } from './js/main.js';
// inside the Compare page (Find a site view): no own page switch; links open in the whole page
if (new URLSearchParams(location.search).has('embed')) { document.documentElement.classList.add('embed'); const b = document.createElement('base'); b.target = '_top'; document.head.appendChild(b); }
mount(document.getElementById('layers-root'));
</script>
