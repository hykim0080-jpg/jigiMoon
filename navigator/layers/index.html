<!doctype html>
<!-- Part of Moon-jigi Lunar Landing Site Navigator (NASA Space Apps 2026). Written with AI assistance (Anthropic Claude), directed and reviewed by the team. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lunar Landing Site Navigator</title>
<link rel="preload" href="../fonts/roboto-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../fonts/roboto.css">
<link rel="stylesheet" href="layers.css">
</head>
<body>
<div id="layers-root"></div>
<script>
// one screen: opened on its own, Find a site is the main page's Find a site tab (this page's hash goes along to it)
(function () { var q = new URLSearchParams(location.search); if (q.has('embed') || q.has('solo') || window.parent !== window) return;
  var l = q.get('lang') || new URLSearchParams(location.hash.slice(1)).get('lang');
  location.replace('../index.html' + (l ? '?lang=' + encodeURIComponent(l) : '') + '#v=find&fh=' + encodeURIComponent(location.hash.slice(1))); })();
</script>
<script type="module">
import { mount } from './js/main.js';
// inside the Compare page (Find a site view): no own page switch; links open in the whole page
if (new URLSearchParams(location.search).has('embed')) { document.documentElement.classList.add('embed'); const b = document.createElement('base'); b.target = '_top'; document.head.appendChild(b); }
mount(document.getElementById('layers-root'));
</script>
</body>
</html>
