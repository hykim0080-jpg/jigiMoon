<!doctype html>
<!-- Part of Moon-jigi Lunar Landing Site Navigator (NASA Space Apps 2026). Written with AI assistance (Anthropic Claude), directed and reviewed by the team. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="generator" content="Written with AI assistance (Anthropic Claude)">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lunar Landing Site Navigator</title>
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/inter.css">
<script>if (!location.hash) location.replace("layers/index.html" + location.search);</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header id="header"></header>
  <main id="main" data-view="focus">
    <section class="panel" id="sky-panel" data-theme="dark">
      <div class="sky-head"><h2 data-t="sky"></h2><div id="countdowns"></div></div>
      <svg id="sky"></svg>
      <svg id="timeline"></svg>
    </section>
    <section class="panel" id="metrics-panel"></section>
    <section class="panel map-panel" id="map-panel" data-theme="dark">
      <h2 id="map-title"><span data-t="map"></span><b id="where"></b></h2>
      <div class="seg" id="zoom"><button data-z="1" data-t="zoomRegion"></button><button data-z="4" data-t="zoomSite"></button><button data-z="spot" data-t="zoomSpot"></button></div>
      <button id="expo" aria-pressed="false"></button>
      <div class="seg" id="basemap"><button data-b="shade" data-t="baseShade"></button><button data-b="line" data-t="baseLine"></button></div>
      <svg id="map"></svg>
      <div id="globe"><canvas></canvas><svg></svg></div>
    </section>
    <div id="fixes"></div>
    <section class="panel" id="compare"></section>
    <section class="panel" id="sites"></section>
    <section class="panel" id="cal-panel"><canvas id="cal"></canvas><div id="cal-overlay"></div><button id="cal-big" type="button">⤢</button></section><div id="cal-back" hidden></div>
    <svg id="chain"></svg>
  </main>
</div>
<div id="tip" hidden></div>
<div id="busy" hidden><i></i></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
